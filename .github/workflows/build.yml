name: Build Single File Plugin

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'            # מפעיל את ה-Workflow כשתדחוף תגית (למשל v1.0.0)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # הרשאה נדרשת ליצירת Release ב-GitHub והעלאת קבצים

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Single File HTML
        run: bun run build

      - name: Pack plugin
        run: node scripts/pack-plugin.js

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-release
          path: |
            *.otzplugin
            dist/*.otzplugin
            dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') # יורץ רק כאשר מדובר בדחיפת Tag
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.otzplugin
            dist/*.otzplugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
